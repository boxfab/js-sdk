name: Publish to npm

# The only path to npm. Triggered by publishing a GitHub Release (pre-releases included; drafts do
# not trigger). Order:
#   verify   tag is v<package.json version>, release commit is on main
#   ci       the full CI workflow on that exact commit; its `build` job makes the tarball
#   publish  uploads exactly that tarball with npm trusted publishing (OIDC, no stored token) and
#            provenance, in the `npm` environment. Dist-tags: 1.2.3 -> latest,
#            1.2.3-alpha.N -> alpha, -beta.N -> beta, -rc.N -> rc (other pre-release names are
#            rejected by scripts/check_release_tag.mjs in `verify`).
# npm trusted publisher (package settings on npmjs.com): GitHub Actions, organization boxfab,
# repository js-sdk, workflow publish.yml, environment npm.

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag matches the package version
        run: node scripts/check_release_tag.mjs "$TAG"
        env:
          TAG: ${{ github.event.release.tag_name }}
      - name: Release commit is the tag's commit and is on main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          [ "$GITHUB_REF" = "refs/tags/$TAG" ] || { echo "ref $GITHUB_REF is not refs/tags/$TAG"; exit 1; }
          tag_commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          [ "$tag_commit" = "$GITHUB_SHA" ] || { echo "tag $TAG -> $tag_commit, workflow SHA $GITHUB_SHA"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main"; exit 1; }
          echo "releasing $TAG at $GITHUB_SHA (on main)"

  ci:
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    secrets:
      DIST_EXTRA_DENY: ${{ secrets.DIST_EXTRA_DENY }}

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/boxfab
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: npm with trusted publishing support (>= 11.5.1)
        run: npm install -g npm@12.2.1 && npm --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: pkg/
      - name: Files to upload
        run: ls -l pkg/ && sha256sum pkg/*
      - name: Publish
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$TAG" in
            v*-alpha.*) dist_tag=alpha ;;
            v*-beta.*) dist_tag=beta ;;
            v*-rc.*) dist_tag=rc ;;
            v*-*) echo "unsupported pre-release in $TAG"; exit 1 ;;
            *) dist_tag=latest ;;
          esac
          echo "publishing $TAG with dist-tag $dist_tag"
          npm publish ./pkg/*.tgz --access public --provenance --tag "$dist_tag"
